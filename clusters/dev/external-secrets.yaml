# External Secrets Operator — Secrets Manager 비밀을 클러스터 Secret 으로 가져옴
# 권한은 Pod Identity (eks 루트가 external-secrets/external-secrets 에 역할 연결 · 비밀 2개만 읽기)
# 차트 기본 SA 이름이 external-secrets 라 Pod Identity 연결과 이름이 같음
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.13.0
    helm:
      releaseName: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
