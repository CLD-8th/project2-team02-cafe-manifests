# 비밀 값은 Secrets Manager team02/dev/monitoring 에만 있음 — 이 파일에는 "어디서 가져올지"만
# ① Grafana 관리자 — 아이디 admin 은 비밀이 아니라 템플릿에 직접, 암호만 가져옴 (values 의 grafana.admin.existingSecret)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: team02/dev/monitoring
        property: GRAFANA_ADMIN_PASSWORD
---
# ② Slack Webhook — values 의 alertmanager.alertmanagerSpec.secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: slack-webhook-url
      remoteRef:
        key: team02/dev/monitoring
        property: SLACK_WEBHOOK_URL
