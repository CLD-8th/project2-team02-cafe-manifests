apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafe
  labels:
    app.kubernetes.io/name: cafe
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # 새 Pod 가 Ready 가 된 뒤에 옛 Pod 를 내림 — 배포 중 끊김 없음
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cafe
    spec:
      # Dockerfile 의 USER app 은 이름이라 runAsNonRoot 검사가 안 됨 → 숫자 UID 를 지정
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: cafe   # overlay 의 images 가 ECR 주소 · 태그로 바꿈
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cafe-config
          # Spring Boot 는 쿠버네티스에서 liveness · readiness 그룹을 자동으로 켬
          # liveness 에는 DB 검사가 없음 → DB 장애로 Pod 가 재시작되지 않음
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data   # 메뉴 사진 (APP_IMAGE_PATH 기본 /app/data/menu-images)
              mountPath: /app/data
            - name: tmp    # 루트 파일시스템이 읽기 전용이라 Tomcat · 업로드 임시 파일용
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
