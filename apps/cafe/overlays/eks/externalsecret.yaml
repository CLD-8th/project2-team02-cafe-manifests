# 비밀 값은 Secrets Manager 에만 있음 — 이 파일에는 "어디서 가져올지"만 적음
# ① DB 계정 — RDS 가 관리하는 마스터 암호 (JSON 키 username · password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cafe-db
  labels:
    app.kubernetes.io/name: cafe
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cafe-db
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:461483516702:secret:rds!db-6a18788a-1f82-48c1-8188-95344886eaa1-ISDrof
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:000000000000:secret:rds!db-xxxxxxxx   # TODO: data 루트 출력 rds_secret_arn
        property: password
---
# ② 앱 비밀 — data 루트가 만든 그릇 team02/dev/cafe 의 JSON 키를 그대로 환경 변수로
#    JSON 키 이름이 곧 변수 이름 : JWT_SECRET · STAFF_USERNAME · STAFF_PASSWORD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cafe-app
  labels:
    app.kubernetes.io/name: cafe
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: cafe-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: team02/dev/cafe
