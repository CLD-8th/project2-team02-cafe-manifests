apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cafe

resources:
  - ../../base
  - namespace.yaml
  - serviceaccount.yaml
  - externalsecret.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - rbac.yaml

labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: dev

# 앱 CI(build-and-update.yml)가 newTag 한 줄을 커밋 SHA 앞 7자리로 바꿈 — 이 파일에 이미지는 하나만 둘 것
images:
  - name: cafe
    newName: 461483516702.dkr.ecr.ap-northeast-2.amazonaws.com/team02/cafe   # TODO: foundation 출력 ecr_repository_url
    newTag: "0000000"   # TODO: 첫 이미지가 push 되면 CI 가 바꿈

patches:
  - path: configmap-prod.yaml
  - path: deployment-eks.yaml
