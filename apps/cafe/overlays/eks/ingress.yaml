apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cafe
  labels:
    app.kubernetes.io/name: cafe
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # ACM 인증서 www.team02.cldlab.click (서울) — HTTPS 는 ALB 에서 종료, 안쪽은 HTTP
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:461483516702:certificate/595b829d-eb02-44ee-af5e-9e6e29ee70d0
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/ssl-redirect: '443'   # HTTP 80 → HTTPS 301
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/load-balancer-name: team02-dev-alb   # 32자 제한
    alb.ingress.kubernetes.io/tags: Owner=jjj16,Team=22,Environment=dev,Project=cafe   # TODO: Owner 학번
    # 롤링 배포 때 빠지는 Pod 를 빨리 대상에서 뺌 (기본 300초)
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    # /actuator/** 는 외부에 내보내지 않음 — ALB 에서 바로 404 로 응답 (앱까지 안 감)
    # ALB 대상 헬스 체크 · Prometheus 수집(ServiceMonitor) 은 Pod 로 직접 가므로 영향 없음
    alb.ingress.kubernetes.io/actions.block-actuator: >
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"404","messageBody":"Not Found"}}
spec:
  ingressClassName: alb
  rules:
    # host 를 비우면 ALB 주소로도 호출 가능 — Route 53 www.team02.cldlab.click 이 이 ALB 를 가리킴
    - http:
        paths:
          # 규칙은 위에서부터 적용되므로 / 보다 먼저 둠
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: block-actuator
                port:
                  name: use-annotation
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cafe
                port:
                  name: http
