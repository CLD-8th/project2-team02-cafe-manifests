apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cafe
  namespace: cafe
  labels:
    app.kubernetes.io/name: cafe
spec:
  namespaceSelector:
    matchNames:
      - cafe
  selector:
    matchLabels:
      app.kubernetes.io/name: cafe
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
